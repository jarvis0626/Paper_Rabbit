spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: paper-rabbit-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paperrabbit_db}
    username: ${DB_USERNAME:paper_rabbit}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

paper-rabbit:
  openalex:
    base-url: ${OPENALEX_BASE_URL:https://api.openalex.org}
    api-key: ${OPENALEX_API_KEY:}
    connect-timeout: ${OPENALEX_CONNECT_TIMEOUT:5s}
    read-timeout: ${OPENALEX_READ_TIMEOUT:20s}
    max-attempts: ${OPENALEX_MAX_ATTEMPTS:3}
    initial-backoff: ${OPENALEX_INITIAL_BACKOFF:250ms}
  web:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  graph:
    persistence-enabled: ${GRAPH_PERSISTENCE_ENABLED:false}
