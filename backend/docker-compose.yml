version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: paperrabbit-postgres
    environment:
      POSTGRES_USER: rabbit_user
      POSTGRES_PASSWORD: rabbit_password
      POSTGRES_DB: paperrabbit_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rabbit_user -d paperrabbit_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.12
    container_name: paperrabbit-neo4j
    environment:
      NEO4J_AUTH: neo4j/rabbit_neo4j_pass
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  neo4jdata:
